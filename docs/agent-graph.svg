<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc">
  <title id="title">FRAMES multi-agent QA architecture</title>
  <desc id="desc">A question enters Lead planning and delegation. A parallel batch fans out to Worker 1, Worker 2 and Worker N, each with an independent context and a read_document tool for local Wikipedia documents. Findings fan in to Lead reassessment, which either delegates another batch or submits an answer to the hybrid evaluator. Dashed amber markers identify the planned Phase 1 Tool-to-Worker and Worker-to-Lead fault injection boundaries. SQLite events support the trace viewer.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/>
    </marker>
    <marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; fill: #172033; text-anchor: middle; }
      .heading { font-size: 24px; font-weight: 700; }
      .name { font-size: 20px; font-weight: 650; }
      .label { font-size: 16px; }
      .small { font-size: 13px; fill: #526176; }
      .code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 14px; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2; stroke-linejoin: round; }
      .lead { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
      .worker { fill: #ecfdf5; stroke: #22a66a; stroke-width: 1.5; }
      .tool { fill: #f0fdfa; stroke: #5a9e96; stroke-width: 1.5; }
      .fault { fill: #fff7ed; stroke: #d97706; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .fault-label { font-size: 13px; fill: #9a4d09; }
    </style>
  </defs>

  <rect width="1200" height="1060" rx="16" fill="#ffffff"/>
  <text class="heading" x="600" y="35">FRAMES Multi-Agent QA</text>
  <rect class="fault" x="874" y="65" width="290" height="34" rx="8"/>
  <text class="fault-label" x="1019" y="87">Phase 1 injection boundaries · TODO</text>

  <!-- The three delivery channels cross the Worker-to-Lead boundary. -->
  <rect class="fault" x="396" y="584" width="772" height="46" rx="8"/>

  <!-- Main flow: question, planning, fan-out, delivery, fan-in, reassessment. -->
  <g class="edge">
    <path d="M600 110 V140" marker-end="url(#arrow)"/>
    <path d="M600 240 V280 M240 280 H960"/>
    <path d="M240 280 V320" marker-end="url(#arrow)"/>
    <path d="M600 280 V320" marker-end="url(#arrow)"/>
    <path d="M960 280 V320" marker-end="url(#arrow)"/>

    <path d="M380 365 H420 V660" marker-end="url(#arrow)"/>
    <path d="M740 365 H780 V660" marker-end="url(#arrow)"/>
    <path d="M1100 365 H1140 V660" marker-end="url(#arrow)"/>
    <path d="M420 660 H1140"/>
    <path d="M600 660 V712" marker-end="url(#arrow)"/>

    <path d="M600 798 V864" marker-end="url(#arrow)"/>
  </g>

  <!-- The Lead continues in its context when another batch is needed. -->
  <path d="M360 755 H40 V190 H360" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" marker-end="url(#blue-arrow)"/>
  <text class="label" x="194" y="742" style="fill:#2563eb">More research</text>
  <text class="small" x="805" y="263">Fan-out · parallel assignments</text>
  <text class="label" x="600" y="646">Fan-in · findings + document IDs</text>
  <text class="fault-label" x="600" y="613">Worker → Lead</text>
  <text class="code" x="764" y="837">submit_answer → {answer}</text>

  <rect x="465" y="62" width="270" height="48" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="name" x="600" y="93">Question</text>

  <rect class="lead" x="360" y="140" width="480" height="100" rx="12"/>
  <text class="name" x="600" y="170">Lead Researcher</text>
  <text class="label" x="600" y="195">Plan &amp; Delegate</text>
  <text class="code" x="600" y="220">memory_write · run_blocking_subagent</text>

  <!-- Worker 1: model context and bidirectional document-tool interaction. -->
  <rect class="worker" x="100" y="320" width="280" height="90" rx="12"/>
  <text class="name" x="240" y="357">Worker 1</text>
  <text class="label" x="240" y="385">Independent context</text>
  <path class="edge" d="M172 410 V492" marker-end="url(#arrow)"/>
  <path class="edge" d="M314 492 V410" marker-end="url(#arrow)"/>
  <text class="small" x="148" y="457">call</text>
  <rect class="fault" x="246" y="436" width="156" height="32" rx="7"/>
  <text class="fault-label" x="324" y="457">Tool → Worker</text>
  <rect class="tool" x="100" y="492" width="280" height="64" rx="10"/>
  <text class="code" x="240" y="518">read_document</text>
  <text class="small" x="240" y="540">Local Wiki documents</text>

  <!-- Worker 2. -->
  <rect class="worker" x="460" y="320" width="280" height="90" rx="12"/>
  <text class="name" x="600" y="357">Worker 2</text>
  <text class="label" x="600" y="385">Independent context</text>
  <path class="edge" d="M532 410 V492" marker-end="url(#arrow)"/>
  <path class="edge" d="M674 492 V410" marker-end="url(#arrow)"/>
  <text class="small" x="508" y="457">call</text>
  <rect class="fault" x="606" y="436" width="156" height="32" rx="7"/>
  <text class="fault-label" x="684" y="457">Tool → Worker</text>
  <rect class="tool" x="460" y="492" width="280" height="64" rx="10"/>
  <text class="code" x="600" y="518">read_document</text>
  <text class="small" x="600" y="540">Local Wiki documents</text>

  <text x="780" y="347" font-size="27" fill="#64748b">…</text>

  <!-- Worker N. -->
  <rect class="worker" x="820" y="320" width="280" height="90" rx="12"/>
  <text class="name" x="960" y="357">Worker N</text>
  <text class="label" x="960" y="385">Independent context</text>
  <path class="edge" d="M892 410 V492" marker-end="url(#arrow)"/>
  <path class="edge" d="M1034 492 V410" marker-end="url(#arrow)"/>
  <text class="small" x="868" y="457">call</text>
  <rect class="fault" x="966" y="436" width="156" height="32" rx="7"/>
  <text class="fault-label" x="1044" y="457">Tool → Worker</text>
  <rect class="tool" x="820" y="492" width="280" height="64" rx="10"/>
  <text class="code" x="960" y="518">read_document</text>
  <text class="small" x="960" y="540">Local Wiki documents</text>

  <rect class="lead" x="360" y="712" width="480" height="86" rx="12"/>
  <text class="name" x="600" y="748">Lead Reassessment</text>
  <text class="label" x="600" y="776">Integrate findings · choose next step</text>

  <rect x="360" y="864" width="480" height="92" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <text class="name" x="600" y="897">Hybrid Evaluator</text>
  <text class="label" x="600" y="922">Exact Match → LLM Judge</text>
  <text class="small" x="600" y="944">Correctness · answer format</text>

  <rect x="100" y="998" width="1000" height="48" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="label" x="600" y="1028">SQLite Event Log &amp; Trace Viewer</text>
</svg>
