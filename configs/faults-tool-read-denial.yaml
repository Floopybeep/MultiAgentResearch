# Worker-stage ACCIDENTAL tool failure at the read_document boundary.
# Starting configuration is the current configs/baseline-pinned.yaml, unmodified
# except for the tool_failure section at the end. Both modes share identical
# targeting and trigger conditions; only the manifestation differs.
# Per-role Chat Completions models and USD-per-million token rates.
lead:
  model: api-glm-5.3-flash
  input_cost_per_million: 0.15
  cached_input_cost_per_million: 0.03
  output_cost_per_million: 0.50
  options:
    temperature: 0
    seed: 42
worker:
  model: api-glm-5.3-flash
  input_cost_per_million: 0.15
  cached_input_cost_per_million: 0.03
  output_cost_per_million: 0.50
  options:
    temperature: 0
    seed: 42
judge:
  model: api-glm-5.3-flash
  input_cost_per_million: 0.15
  cached_input_cost_per_million: 0.03
  output_cost_per_million: 0.50
  max_output_tokens: 1024
  options:
    temperature: 0
    seed: 42
# Chat Completions generation options (e.g. reasoning_effort) go under `options`.
# Optional prompt files, relative to the working directory; null uses bundled defaults.
# lead_prompt: src/multi_agent_research/prompts/lead_old.md
# worker_prompt: src/multi_agent_research/prompts/worker_old.md
lead_prompt: src/multi_agent_research/prompts/lead.md
worker_prompt: src/multi_agent_research/prompts/worker.md
# Inject into at most num_docs successful read_document calls per question run.
document_injection:
  enabled: false
  num_docs: 1
  prompt: ""
max_lead_turns: 10
max_worker_turns: 5
# Per worker: search + fetch + failed calls + completion; also rendered in the worker prompt.
max_worker_tool_calls: 15
max_batches: 6
max_workers_per_batch: 4
# Lead instruction: minimum workers to spawn in each delegation batch.
minimum_worker: 3
# Raised from baseline.yaml's 200000. That budget is cumulative across the Lead
# AND every worker, so document-heavy questions exhausted it inside the worker
# stage and returned no answer: measured on Q25 (workers burned 207508 of 208356
# input tokens, leaving the Lead a single model call) and Q783 (two batch-2
# workers died on run_token_budget). Both were then recorded as correct=False by
# runner.py:88, i.e. scored as wrong answers rather than execution failures.
# 600000 is headroom, not a target; completed questions stay far below it.
max_run_tokens: 600000
run_timeout_seconds: 900
worker_timeout_seconds: 180
call_timeout_seconds: 60
max_document_chars: 24000
output_dir: runs

# Accidental read_document failure. See configs/README.md#tool-failure-injection.
#
# THE TWO SMOKE-TEST CONDITIONS DIFFER ONLY IN `enabled`:
#   3a clean reference : enabled: false
#   3b immediate fault : enabled: true, mode: immediate
#   3c timeout fault   : enabled: true, mode: timeout
# Restored to the 3a clean condition: enabled false, mode immediate.
# Flip that one line between runs; nothing else changes. Each run records its
# own effective settings under the `config` key in its events.sqlite, so the
# one-field delta is verifiable from the traces afterwards.
tool_failure:
  enabled: false
  # immediate: the tool errors at once. timeout: the read outlasts
  # call_timeout_seconds and call_tool's asyncio.wait_for raises TimeoutError.
  mode: immediate
  # Empty list means any document; empty offsets means any page of a target.
  # Targets absent from a question simply never match.
  #
  # PROVISIONAL target for the Q143 smoke test, supplied here and never in code.
  # Confirm from the 3a trace that this document and offset are actually
  # requested under this configuration before running 3b; earlier Q143 traces
  # used different prompts and turn limits and are advisory only.
  document_ids: ["doc_0478"]
  offsets: [0]
  # Maximum tool calls SELECTED for failure per question run, shared across all
  # workers. Counts triggered attempts, including ones later cancelled.
  # null is uncapped and additionally requires allow_total_denial when
  # document_ids is empty.
  max_failures: 1
  # 1.0 is deterministic targeting and ignores seed. Below 1.0 draws a SHA-256
  # verdict per eligible call.
  failure_probability: 1.0
  # true keeps failing the page; false denies only the first attempt per
  # (document_id, offset) in the run, so a retry or a re-delegated worker reads it.
  persistent: false
  # delay = call_timeout_seconds * timeout_margin. Must exceed 1.0 so raising
  # the tool timeout cannot silently disarm the timeout mode.
  timeout_margin: 1.5
  # Dedicated to fault selection; independent of the CLI --seed that samples questions.
  seed: 20261104
  # Opt-in for uncapped denial of every document, which deadlocks the Lead.
  allow_total_denial: false
