# Per-role Chat Completions models and USD-per-million token rates.
lead:
  model: api-glm-5.3-flash
  input_cost_per_million: 0.15
  cached_input_cost_per_million: 0.03
  output_cost_per_million: 0.50
worker:
  model: api-glm-5.3-flash
  input_cost_per_million: 0.15
  cached_input_cost_per_million: 0.03
  output_cost_per_million: 0.50
judge:
  model: api-glm-5.3-flash
  input_cost_per_million: 0.15
  cached_input_cost_per_million: 0.03
  output_cost_per_million: 0.50
  max_output_tokens: 1024
# Chat Completions generation options (e.g. reasoning_effort) go under `options`.
max_lead_turns: 20
max_worker_turns: 12
max_worker_tool_calls: 20
max_batches: 6
max_workers_per_batch: 4
max_run_tokens: 200000
run_timeout_seconds: 900
worker_timeout_seconds: 180
call_timeout_seconds: 60
max_document_chars: 24000
output_dir: runs
