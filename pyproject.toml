[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multi-agent-research"
version = "0.1.0"
description = "Instrumented LangGraph reproduction of Anthropic's published research architecture"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "langchain-core>=1,<2", "langchain-openai>=1,<2",
  "pydantic>=2,<3", "httpx>=0.28,<1", "beautifulsoup4>=4.13,<5", "pyyaml>=6,<7"
]

[project.scripts]
mar = "multi_agent_research.cli:main"
mar-view = "multi_agent_research.viewer:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
